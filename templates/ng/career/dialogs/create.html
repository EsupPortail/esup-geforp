<div class="modal-header">
    <button type="button" class="close" ng-click="dialog.dismiss()" aria-hidden="true">×</button>
    <h4 class="modal-title"><i class="fa fa-user"></i> Ajouter un parcours</h4>
</div>

<form sf-href="career.create" sf-form="form" json-path="form" on-success="onSuccess(data)" class="form-horizontal"
      novalidate>
    <div class="modal-body">
        <div class="form-group" ng-if="form.children.name"
             ng-class="{'has-error': form.children.name.errors.length }">
            <label class="col-sm-3 control-label">{{ form.children.name.label}}</label>
            <div class="col-sm-9">
                <span sf-form-widget="form.children.name" class="form-control"></span>
                <div ng-if="form.children.name.errors.length" ng-repeat="error in form.children.name.errors" class="help-block">{{ error }}
                </div>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <a class="btn btn-default" ng-click="dialog.dismiss()">Annuler</a>
        <input class="btn btn-primary" type="submit" value="Enregistrer"/>
    </div>
</form>
